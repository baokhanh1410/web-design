<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự Đoán Giá Nhà | House Price Prediction</title>
</head>
<body>

  <h1>Dự Đoán Giá Nhà</h1>
  <p>Nhập thông tin bất động sản để tính toán giá trị dự kiến</p>

  <form id="houseForm">
    <div>
      <label for="area">Diện tích (m²):</label>
      <input 
        type="number" 
        id="area" 
        name="area" 
        step="any" 
        min="1" 
        required 
      />
    </div>
    <br>

    <div>
      <label for="bedrooms">Số phòng ngủ:</label>
      <input 
        type="number" 
        id="bedrooms" 
        name="bedrooms" 
        step="1" 
        min="0" 
        required 
      />
    </div>
    <br>

    <div>
      <label for="location">Khu vực (Địa điểm):</label>
      <select id="location" name="location">
        <option value="other" selected>Khu vực khác</option>
        <option value="hanoi">Hà Nội</option>
        <option value="hcmc">TP. Hồ Chí Minh</option>
      </select>
    </div>
    <br>

    <div>
      <label for="apiMethod">Phương thức gọi API:</label>
      <select id="apiMethod" name="apiMethod">
        <option value="GET" selected>GET /predict</option>
        <option value="POST">POST /predict</option>
      </select>
    </div>
    <br>

    <button type="submit" id="submitBtn">Dự đoán giá ngay</button>
  </form>

  <hr>

  <div id="errorCard" style="display: none; color: red;">
    <strong>Lỗi: </strong><span id="errorMessage"></span>
  </div>

  <div id="resultCard" style="display: none;">
    <h2>Kết Quả Dự Đoán</h2>
    <p><strong>Giá dự kiến: </strong><span id="priceDisplay" style="font-size: 1.5em; font-weight: bold; color: green;">0 VND</span></p>
    <ul>
      <li>Diện tích: <span id="summaryArea">--</span></li>
      <li>Phòng ngủ: <span id="summaryBedrooms">--</span></li>
      <li>Khu vực: <span id="summaryLocation">--</span></li>
    </ul>
    <p><small>API gọi: <span id="apiCallMethod">GET</span> <span id="apiCallUrl">/predict?...</span></small></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('houseForm');
      const areaInput = document.getElementById('area');
      const bedroomsInput = document.getElementById('bedrooms');
      const locationInput = document.getElementById('location');
      const methodSelect = document.getElementById('apiMethod');
      const submitBtn = document.getElementById('submitBtn');

      const resultCard = document.getElementById('resultCard');
      const priceDisplay = document.getElementById('priceDisplay');
      const summaryArea = document.getElementById('summaryArea');
      const summaryBedrooms = document.getElementById('summaryBedrooms');
      const summaryLocation = document.getElementById('summaryLocation');
      const apiCallUrl = document.getElementById('apiCallUrl');
      const apiCallMethod = document.getElementById('apiCallMethod');

      const errorCard = document.getElementById('errorCard');
      const errorMessage = document.getElementById('errorMessage');

      const formatCurrencyVND = (amount) => {
        if (typeof amount !== 'number' || isNaN(amount)) return '0 VND';
        return new Intl.NumberFormat('vi-VN').format(amount) + ' VND';
      };

      const getLocationDisplayName = (loc) => {
        const locLower = (loc || '').toLowerCase().trim();
        if (locLower === 'hanoi') return 'Hà Nội';
        if (locLower === 'hcmc') return 'TP. Hồ Chí Minh';
        return loc ? loc : 'Khu vực khác';
      };

      const clearStatus = () => {
        resultCard.style.display = 'none';
        errorCard.style.display = 'none';
        errorMessage.textContent = '';
      };

      const showError = (msg) => {
        clearStatus();
        errorMessage.textContent = msg;
        errorCard.style.display = 'block';
      };

      const showResult = (data, method, requestedUrl) => {
        clearStatus();

        priceDisplay.textContent = formatCurrencyVND(data.predicted_price);
        summaryArea.textContent = `${data.area} m²`;
        summaryBedrooms.textContent = `${data.bedrooms} phòng`;
        summaryLocation.textContent = getLocationDisplayName(data.location);

        if (apiCallMethod) apiCallMethod.textContent = method;
        if (apiCallUrl) apiCallUrl.textContent = requestedUrl;

        resultCard.style.display = 'block';
      };

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearStatus();

        const area = parseFloat(areaInput.value);
        const bedrooms = parseInt(bedroomsInput.value, 10);
        const location = (locationInput.value || '').trim();
        const method = methodSelect ? methodSelect.value : 'GET';

        if (isNaN(area) || area <= 0) {
          showError('Vui lòng nhập diện tích hợp lệ (> 0 m²).');
          areaInput.focus();
          return;
        }

        if (isNaN(bedrooms) || bedrooms < 0) {
          showError('Vui lòng nhập số phòng ngủ hợp lệ (≥ 0).');
          bedroomsInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang tính toán...';

        try {
          let response;
          let displayUrl = '';

          if (method === 'POST') {
            displayUrl = '/predict';
            response = await fetch('/predict', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                area: area,
                bedrooms: bedrooms,
                location: location || 'other',
              }),
            });
          } else {
            const params = new URLSearchParams();
            params.append('area', area);
            params.append('bedrooms', bedrooms);
            if (location) {
              params.append('location', location);
            }

            displayUrl = `/predict?${params.toString()}`;
            response = await fetch(displayUrl, {
              method: 'GET',
            });
          }

          if (!response.ok) {
            let errorDetail = `Lỗi (${response.status} ${response.statusText})`;
            try {
              const errData = await response.json();
              if (errData && errData.detail) {
                if (Array.isArray(errData.detail)) {
                  errorDetail = errData.detail.map(d => `${d.loc ? d.loc.join('.') : 'field'}: ${d.msg}`).join('; ');
                } else {
                  errorDetail = errData.detail;
                }
              }
            } catch {
            }
            throw new Error(errorDetail);
          }

          const data = await response.json();
          showResult(data, method, displayUrl);

        } catch (err) {
          console.error('Lỗi khi gọi API:', err);
          if (err.name === 'TypeError' && err.message.includes('fetch')) {
            showError('Không thể kết nối đến API. Hãy kiểm tra xem Uvicorn đã chạy trên port 8000 chưa.');
          } else {
            showError(err.message || 'Đã có lỗi xảy ra.');
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Dự đoán giá ngay';
        }
      });
    });
  </script>

</body>
</html>
